[project]
name = "tech-selection-agent"
version = "0.1.0"
description = "Evidence-grounded, revision-aware technology selection research workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2",
  "openai>=1.75,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "gradio>=5.49,<6", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[project.scripts]
selection = "selection_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/selection_agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
