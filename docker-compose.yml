services:
  selection:
    build: .
    ports: ["127.0.0.1:8050:8050"]
    environment:
      AGENT_MODE: ${AGENT_MODE:-fixture}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v3.2}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes: [selection_data:/data]
volumes:
  selection_data:
